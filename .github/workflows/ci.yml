name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python dependencies
        run: uv sync
      # Same Makefile and flags as local builds (ADR-002). Bit-reproducibility across
      # thread counts is asserted by the tests; agreement with the Windows build is
      # statistical only (ADR-003).
      - name: C++ tests
        run: make cpp-test
      - name: Kernel error bound
        run: make error-bound
      - name: Python tests
        run: make pytest
      # Node 24: the runner's preinstalled Node may be older than the tests need.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The page's logic, and the committed WebAssembly build against the native
      # engine's published probabilities (ADR-016). No WebAssembly rebuild here.
      - name: Page tests
        run: node --test viz/tests/
      - name: Benchmark (informational; runner hardware varies)
        run: make bench
